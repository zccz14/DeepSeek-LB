[package]
name = "openai-lb"
version = "0.2.212"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
auth-mini-axum = "=0.1.2"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
dashmap = "6"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls", "stream", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sse-core = { version = "0.2.3", default-features = false, features = ["std"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "network", "system"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zstd = "0.13"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
flate2 = "1"
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
