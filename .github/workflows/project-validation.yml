name: project-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-validation:
    name: project-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run check
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --all-features --locked

  audit:
    name: audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - name: RustSec audit
        # SQLx records its optional MySQL driver in Cargo.lock. The SQLite-only
        # dependency graph does not contain rsa (`cargo tree -i rsa` is empty).
        #
        # RUSTSEC-2026-0459 is the bundled SQLite C library: sqlx 0.8 and 0.9 both
        # pin libsqlite3-sys 0.30, and sqlx 0.9 needs a newer rustc than this
        # project builds with, so the fix is blocked upstream rather than here.
        # Track it until sqlx ships libsqlite3-sys 0.39; the advisory needs a
        # hostile SQL script against our own database to matter.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459
